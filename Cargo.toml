[package]
name = "hypr-display-manager"
version = "0.1.0"
edition = "2021"
authors = ["Hyprview Contributors"]
description = "Modern, visual, and safe display manager for Hyprland built with Rust, Relm4, and Libadwaita"
license = "MIT OR Apache-2.0"

[dependencies]
# GUI & GNOME HIG (Libadwaita bindings via Relm4)
relm4 = { version = "0.11", features = ["libadwaita"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
gtk4 = "0.11"
pangocairo = "0.22"
gio = "0.22"

# Asynchronous Runtime & IPC
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "process"] }
futures = "0.3"

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
